<text x="48" y="1222" font-size="19" style="fill:#192a40" font-weight="bold">공통 GND: 배터리 보호 출력 P− / 두 승압 모듈 IN−·OUT− / ESP32 GND / 두 ULN의 8번</text>
<text x="48" y="1260" font-size="19" style="fill:#192a40" font-weight="normal">• ULN2003A의 9번 COM은 보호 다이오드 공통단자입니다. 해당 모터의 +5V 또는 +12V에 연결합니다.</text>
<text x="48" y="1292" font-size="19" style="fill:#192a40" font-weight="normal">• 드라이버 근처 각 전원–GND에 100nF + 벌크 커패시터 배치를 검토합니다. 용량은 승압 모듈 사양·부하로 결정.</text>
<text x="48" y="1324" font-size="19" style="fill:#192a40" font-weight="normal">• 3.3V 입력의 구동 여유, 코일 전류·발열 및 승압 출력 용량은 실측 확인 필요. 12V/0.3A로 충분한지는 미확인.</text>
<text x="48" y="1356" font-size="19" style="fill:#192a40" font-weight="normal">• 그림은 IC 핀 번호 기준입니다. 기성 ULN2003 모듈의 커넥터 순서·전원 정격은 별도 확인해야 합니다.</text>
<text x="48" y="1391" font-size="16" style="fill:#5c6d83" font-weight="normal">PIN SOURCE: Texas Instruments ULN2003A datasheet, Rev. T  |  2026-10-28</text>
